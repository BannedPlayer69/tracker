<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171512">
<title>Tempo</title>
<link rel="manifest" href="./manifest.json">
<style>
/* ============ Base ============ */
:root{
  --sfondo:#171512;
  --superficie:#211e1a;
  --superficie2:#2a2621;
  --bordo:#37322b;
  --testo:#ece7dc;
  --testo2:#a69e8f;
  --testo3:#736c5f;
  --crema:#e9e2d2;
  --crema-testo:#1a1815;
  --inv:#4fbf8b;
  --disp:#c98a5e;
  --grigio:#3a352e;
  --rischio:#a34a35;
  --avviso-sfondo:#33270f;
  --avviso-bordo:#6b5320;
  --avviso-testo:#e8c877;
  --raggio:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--sfondo);color:var(--testo);
  font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;user-select:none}
input,select,textarea{
  font:inherit;color:var(--testo);background:var(--superficie2);
  border:1px solid var(--bordo);border-radius:10px;padding:12px 14px;min-height:48px;width:auto;
}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--testo3);outline-offset:2px}
main{max-width:880px;margin:0 auto;padding:20px 20px 8px}
h2{margin:0 0 6px;font-size:21px;font-weight:650}
.micro{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--testo3);margin:28px 4px 12px;font-weight:600}
.pallino{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.pannello{background:var(--superficie);border:1px solid var(--bordo);border-radius:var(--raggio);padding:10px 16px}
.badge{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--testo2);border:1px solid var(--bordo);border-radius:999px;padding:3px 10px;white-space:nowrap}

/* ============ Bottoni ============ */
.btn{border-radius:14px;padding:0 22px;min-height:56px;font-size:18px;font-weight:600;border:1px solid var(--bordo);background:var(--superficie2);display:inline-flex;align-items:center;justify-content:center}
.btn:active{filter:brightness(1.12)}
.btn-primario{background:var(--crema);color:var(--crema-testo);border-color:var(--crema)}
.btn-fantasma{background:transparent}
.btn-rischio{background:transparent;color:#dfa091;border-color:#5c3b31}
.btn-rischio-pieno{background:var(--rischio);border-color:var(--rischio);color:#f6e9e4}
.btn-piccolo{min-height:46px;padding:0 16px;font-size:15px;font-weight:600;border-radius:10px;border:1px solid var(--bordo);background:var(--superficie2);display:inline-flex;align-items:center}
.btn-x{width:48px;height:48px;flex:none;border-radius:10px;border:1px solid var(--bordo);color:var(--testo2);font-size:17px;display:inline-flex;align-items:center;justify-content:center}

/* ============ Sessione attiva ============ */
.card-attiva{background:var(--superficie);border:1px solid var(--bordo);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:16px}
.riga-attiva{display:flex;align-items:center;gap:10px;color:var(--testo2);flex-wrap:wrap}
.riga-attiva .etichetta{color:var(--testo);font-weight:600}
.da-quando{margin-left:auto;font-variant-numeric:tabular-nums}
.crono{font-size:clamp(56px,9vw,88px);font-weight:250;letter-spacing:.01em;font-variant-numeric:tabular-nums;line-height:1}
.input-nota{width:100%}
.azioni-attiva{display:flex;gap:12px;flex-wrap:wrap}

/* ============ Avvio rapido ============ */
.griglia-rapida{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:600px){.griglia-rapida{grid-template-columns:1fr}}
.btn-rapido{background:var(--superficie);border:1px solid var(--bordo);border-radius:var(--raggio);min-height:112px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;gap:12px}
.btn-rapido:active{background:var(--superficie2)}
.btn-rapido .testi{display:flex;flex-direction:column;gap:2px;min-width:0}
.btn-rapido .nome{font-size:20px;font-weight:650;overflow-wrap:anywhere}
.btn-rapido .cat{font-size:13px;color:var(--testo2);overflow-wrap:anywhere}

/* ============ Elenco categorie ============ */
.blocco-cat{background:var(--superficie);border:1px solid var(--bordo);border-radius:var(--raggio);padding:14px 16px;margin-bottom:12px}
button.blocco-cat{display:block;width:100%;text-align:left}
button.blocco-cat:active{background:var(--superficie2)}
.testa-cat{display:flex;align-items:center;gap:10px;min-height:40px}
.testa-cat .nome{font-weight:650;font-size:18px}
.testa-cat .tipo{margin-left:auto;font-size:11px;color:var(--testo3);letter-spacing:.1em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.chip{border:1px solid var(--bordo);background:var(--superficie2);border-radius:12px;padding:12px 20px;min-height:54px;font-size:17px;display:inline-flex;align-items:center}
.chip:active{border-color:var(--testo3)}
.vuoto{color:var(--testo2);padding:24px 4px}

/* ============ Vista giorno ============ */
.testa-giorno{display:flex;align-items:center;gap:8px}
.testa-giorno .data{flex:1;text-align:center;font-size:19px;font-weight:650}
.btn-freccia{width:58px;height:58px;border-radius:12px;border:1px solid var(--bordo);background:var(--superficie);font-size:24px;display:inline-flex;align-items:center;justify-content:center;color:var(--testo2)}
.btn-freccia:disabled{opacity:.3}
.torna{text-align:center;margin-top:10px}
.barra-ore{display:flex;height:26px;border-radius:999px;overflow:hidden;background:var(--grigio);margin-top:18px}
.seg{height:100%}
.seg-inv{background:var(--inv)}
.seg-disp{background:var(--disp)}
.legenda{display:flex;gap:8px 22px;flex-wrap:wrap;margin-top:12px;color:var(--testo2);font-size:14px}
.legenda span{display:inline-flex;align-items:center}
.legenda .pallino{width:10px;height:10px;margin-right:7px}
.tot-riga{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--bordo)}
.tot-riga:last-child{border-bottom:0}
.tot-riga .durata{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--testo2)}
.sess{width:100%;display:flex;gap:14px;padding:14px;background:var(--superficie);border:1px solid var(--bordo);border-radius:var(--raggio);margin-bottom:10px;text-align:left;align-items:stretch}
.sess:active{background:var(--superficie2)}
.sess .orari{width:72px;flex:none;color:var(--testo2);font-variant-numeric:tabular-nums;font-size:14px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.sess .filo{width:4px;border-radius:2px;flex:none}
.sess .corpo{flex:1;min-width:0}
.sess .titolo{display:block;font-weight:600}
.sess .titolo .badge{margin-left:8px;vertical-align:1px}
.sess .sotto{display:block;color:var(--testo2);font-size:14px;margin-top:3px;overflow-wrap:anywhere}
.sess .durata{flex:none;align-self:center;color:var(--testo2);font-variant-numeric:tabular-nums;padding-left:6px;white-space:nowrap}

/* ============ Vista settimana (obiettivi) ============ */
.setti-n{text-align:center;color:var(--testo3);font-size:14px;margin-top:6px}
.obiettivo{margin-top:16px}
.obiettivo-testa{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.obiettivo-testa .nome{font-weight:650}
.obiettivo-testa .valori{margin-left:auto;color:var(--testo2);font-variant-numeric:tabular-nums;white-space:nowrap}
.barra-obiettivo{margin-top:0}
.obiettivo-sotto{margin-top:6px;font-size:13px;color:var(--testo3)}

/* ============ Barra di navigazione ============ */
nav#barra{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--superficie);border-top:1px solid var(--bordo);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.barra-int{max-width:880px;margin:0 auto;display:flex;gap:6px;padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}
nav#barra .tab{flex:1;min-height:58px;border-radius:12px;font-size:17px;font-weight:600;color:var(--testo2);display:inline-flex;align-items:center;justify-content:center}
nav#barra .tab.attiva{color:var(--testo);background:var(--superficie2)}
nav#barra .tab-icona{flex:0 0 68px}

/* ============ Banner di avviso storage ============ */
#banner{position:sticky;top:0;z-index:40;background:var(--avviso-sfondo);color:var(--avviso-testo);border-bottom:1px solid var(--avviso-bordo);padding:12px 16px;font-size:15px;text-align:center}

/* ============ Modali ============ */
#velo{position:fixed;inset:0;background:rgba(10,9,7,.65);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
#modale{background:var(--superficie);border:1px solid var(--bordo);border-radius:20px;max-width:580px;width:100%;max-height:88vh;overflow:auto;padding:24px}
#modale .micro:first-child{margin-top:6px}
.sotto-titolo{color:var(--testo2);margin:0 0 18px}
.campo{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.campo label{font-size:13px;color:var(--testo2);letter-spacing:.04em}
.campo input,.campo select,.campo textarea{width:100%}
.riga-bottoni{display:flex;gap:12px;justify-content:flex-end;align-items:center;margin-top:20px;flex-wrap:wrap}
.spinta{flex:1}
.errore{background:var(--avviso-sfondo);border:1px solid var(--avviso-bordo);color:var(--avviso-testo);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:15px}
.avvio-scelte{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.avvio-scelte .btn{min-height:80px;text-align:center}
@media(max-width:540px){.avvio-scelte{grid-template-columns:1fr}}
.segmentato{display:flex;border:1px solid var(--bordo);border-radius:12px;overflow:hidden}
.segmentato button{flex:1;min-height:52px;background:var(--superficie2);color:var(--testo2);font-size:15px;padding:0 10px}
.segmentato button.sel{background:var(--crema);color:var(--crema-testo);font-weight:650}

/* ============ Impostazioni ============ */
.imp-cat{border:1px solid var(--bordo);border-radius:14px;padding:14px;margin-bottom:12px;background:var(--superficie2)}
.imp-riga{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.imp-riga input[type=text]{flex:1;min-width:150px}
input[type=color]{padding:3px;width:48px;height:48px;min-height:48px;flex:none;background:none;border-radius:10px}
.imp-sub{display:flex;gap:8px;align-items:center;margin-top:10px}
.imp-sub input{flex:1;background:var(--superficie)}

/* ============ Modalità concentrazione ============ */
#focus{position:fixed;inset:0;background:var(--sfondo);z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:24px}
#focus .contesto{color:var(--testo2);font-size:20px;display:flex;gap:12px;align-items:center}
#focus .crono{font-size:clamp(88px,17vw,230px)}
#focus .btn{min-width:220px}
#focus .esci{position:absolute;top:max(16px,env(safe-area-inset-top));right:16px;width:58px;height:58px;border-radius:50%;border:1px solid var(--bordo);color:var(--testo2);font-size:20px;display:inline-flex;align-items:center;justify-content:center}

/* ============ Trend, review, backup ============ */
.trend{display:flex;gap:6px;align-items:stretch;height:130px;margin-top:4px}
.trend-col{flex:1;display:flex;flex-direction:column;min-width:0}
.trend-area{flex:1;display:flex;gap:3px;align-items:flex-end;justify-content:center}
.trend-barra{width:38%;max-width:22px;border-radius:4px 4px 0 0;min-height:3px}
.trend-eti{text-align:center;font-size:11px;color:var(--testo3);margin-top:6px;font-variant-numeric:tabular-nums}
.review-card{margin-top:12px}
.review-range{font-weight:650}
.review-q{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--testo3);margin-top:12px}
.review-a{white-space:pre-wrap;margin-top:2px}
.riga-backup{margin-top:26px;text-align:center;font-size:13px;color:var(--testo3)}
#undo{position:fixed;left:0;right:0;bottom:calc(88px + env(safe-area-inset-bottom));z-index:45;display:flex;justify-content:center;padding:0 20px;pointer-events:none}
.undo-int{pointer-events:auto;background:var(--superficie2);border:1px solid var(--bordo);border-radius:14px;padding:10px 10px 10px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 8px 24px rgba(0,0,0,.35)}

/* ============ Schermata di attrito ============ */
#attrito{position:fixed;inset:0;background:var(--sfondo);z-index:90;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
#attrito .scatola{width:100%;max-width:560px}
.attrito-cat{display:flex;align-items:center;justify-content:center;gap:10px;font-size:22px;font-weight:650;margin-bottom:4px}
#attrito .tot-riga .durata{white-space:normal;text-align:right}
.attrito-azioni{display:flex;gap:12px;margin-top:26px}
.attrito-azioni .btn{flex:1;min-height:64px}
.btn:disabled{opacity:.45}
.attrito-chiusa{color:var(--testo2);text-align:center;font-size:18px}

/* ============ Animazioni (solo presentazione) ============
   Si attivano una tantum al cambio di vista o di giorno (classe .anima-vista
   aggiunta da animaIngresso e rimossa a fine corsa), mai sugli aggiornamenti
   periodici del timer. La card della sessione attiva è esclusa: il cronometro
   non deve muoversi. Con prefers-reduced-motion tutto questo blocco sparisce. */
@media (prefers-reduced-motion: no-preference){
  @keyframes apparizione{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes crescitaX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes crescitaY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  .anima-vista > *:not(.card-attiva){animation:apparizione 200ms ease-out both}
  .anima-vista .seg{transform-origin:left center;animation:crescitaX 300ms ease-out both}
  .anima-vista .filo{transform-origin:center top;animation:crescitaY 300ms ease-out both}
  .btn-rapido,.chip,button.blocco-cat{transition:transform 120ms ease}
  .btn-rapido:active,.chip:active,button.blocco-cat:active{transform:scale(.97)}
  .anima-vista .trend-barra{transform-origin:center bottom;animation:crescitaY 300ms ease-out both}
  @keyframes undoEntra{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes undoEsce{to{opacity:0;transform:translateY(16px)}}
  #undo:not(.undo-uscita) .undo-int{animation:undoEntra 200ms ease-out}
  #undo.undo-uscita .undo-int{animation:undoEsce 200ms ease-in both}
}
</style>
</head>
<body>
<div id="banner" hidden></div>
<main>
  <section id="vista-home"></section>
  <section id="vista-giorno" hidden></section>
  <section id="vista-settimana" hidden></section>
</main>
<nav id="barra">
  <div class="barra-int">
  <button class="tab" data-vista="home">Home</button>
  <button class="tab" data-vista="giorno">Oggi</button>
  <button class="tab attiva" data-vista="settimana">Settimana</button>
  <button class="tab tab-icona" data-impostazioni aria-label="Impostazioni">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <line x1="3" y1="7" x2="21" y2="7"></line><circle cx="9" cy="7" r="3" fill="var(--superficie)"></circle>
      <line x1="3" y1="17" x2="21" y2="17"></line><circle cx="15" cy="17" r="3" fill="var(--superficie)"></circle>
    </svg>
  </button>
  </div>
</nav>
<div id="focus" hidden></div>
<div id="attrito" hidden></div>
<div id="undo" hidden><div class="undo-int"><span>Eliminata</span><button class="btn-piccolo" data-undo-annulla>Annulla</button></div></div>
<div id="velo" hidden><div id="modale" role="dialog" aria-modal="true"></div></div>

<script>
'use strict';

/* ================= Costanti e utilità ================= */
const CHIAVE = 'tt_v1';
const SEI_ORE_MS = 6 * 60 * 60 * 1000;
const QUATTORDICI_GIORNI_MS = 14 * 24 * 60 * 60 * 1000;
const ETICHETTA_AVVIO = { deciso: 'scelto', scivolato: 'scivolato' };

const $ = (sel, radice) => (radice || document).querySelector(sel);

function esc(testo) {
  return String(testo == null ? '' : testo).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function nuovoId() {
  return (typeof crypto !== 'undefined' && crypto.randomUUID)
    ? crypto.randomUUID()
    : Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

function fmtCrono(ms) {
  const tot = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(tot / 3600);
  const m = Math.floor((tot % 3600) / 60);
  const s = tot % 60;
  return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function fmtDurata(ms) {
  const min = Math.round(Math.max(0, ms) / 60000);
  const h = Math.floor(min / 60);
  const m = min % 60;
  return h === 0 ? (m + ' min') : (h + 'h ' + String(m).padStart(2, '0') + 'm');
}

function fmtOra(d) { return d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }); }
function fmtDataBreve(d) { return d.toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'short' }); }
function stessoGiorno(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}
function inizioGiorno(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function fineGiorno(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1); }
// Settimane lunedì-domenica.
function inizioSettimana(d) {
  const g = inizioGiorno(d);
  const scarto = (g.getDay() + 6) % 7; // lun=0 ... dom=6
  return new Date(g.getFullYear(), g.getMonth(), g.getDate() - scarto);
}
function fineSettimana(d) {
  const i = inizioSettimana(d);
  return new Date(i.getFullYear(), i.getMonth(), i.getDate() + 7);
}

function aInputDataOra(d) {
  const p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
    'T' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function aInputData(d) {
  const p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

/* ================= Stato ================= */
let stato = null;
let statoCorrotto = false;
let erroreSalvataggio = false;
let vistaCorrente = 'settimana';
let giornoVista = new Date();
let avvisoVecchioMostrato = false;
let secondi = 0;

function statoDefault() {
  const idStudio = nuovoId(), idCrescita = nuovoId(), idGaming = nuovoId(), idFeed = nuovoId();
  return {
    schemaVersion: 3,
    categorie: [
      { id: idStudio,   nome: 'Studio uni',                    colore: '#5b8def', tipo: 'investimento' },
      { id: idCrescita, nome: 'Crescita personale',            colore: '#4fbf8b', tipo: 'investimento' },
      { id: idGaming,   nome: 'Gaming',                        colore: '#b07ce8', tipo: 'dispersione' },
      { id: idFeed,     nome: 'Feed — shorts, reels, scroll',  colore: '#e0a458', tipo: 'dispersione' }
    ],
    sottocategorie: [
      { id: nuovoId(), categoriaId: idStudio,   nome: 'C++' },
      { id: nuovoId(), categoriaId: idStudio,   nome: 'Analisi' },
      { id: nuovoId(), categoriaId: idCrescita, nome: 'Matematica' },
      { id: nuovoId(), categoriaId: idCrescita, nome: 'Sport' },
      { id: nuovoId(), categoriaId: idCrescita, nome: 'Lettura' },
      { id: nuovoId(), categoriaId: idCrescita, nome: 'Progetti' }
    ],
    sessioni: [],
    impostazioni: {
      oreSveglio: 16,
      dataInizioPercorso: new Date().toISOString(),
      targetFinali: { studio: 14, crescita: 14 },  // ore/settimana
      tettoScivolato: 5,                           // ore/settimana, fisso
      rampa: [7, 7, 9, 9, 11, 11, 13, 13],         // ore per settimana 1..8
      ultimoBackup: null
    },
    reviews: []
  };
}

// Porta qualsiasi schema supportato (1..3) all'ultimo, aggiungendo solo campi.
function migra(dati) {
  if (dati.schemaVersion === 1) {
    dati.impostazioni.targetFinali = { studio: 14, crescita: 14 };
    dati.impostazioni.tettoScivolato = 5;
    dati.impostazioni.rampa = [7, 7, 9, 9, 11, 11, 13, 13];
    dati.schemaVersion = 2;
  }
  if (dati.schemaVersion === 2) {
    dati.impostazioni.ultimoBackup = null;
    dati.reviews = [];
    dati.schemaVersion = 3;
  }
  if (!Array.isArray(dati.reviews)) dati.reviews = [];
  return dati;
}

function carica() {
  let grezzo = null;
  try {
    grezzo = localStorage.getItem(CHIAVE);
  } catch (err) {
    // Storage non disponibile: si lavora in memoria e lo si segnala.
    stato = statoDefault();
    erroreSalvataggio = true;
    return;
  }
  if (grezzo === null) { stato = statoDefault(); salva(); return; }
  try {
    const dati = JSON.parse(grezzo);
    const valido = dati && (dati.schemaVersion === 1 || dati.schemaVersion === 2 || dati.schemaVersion === 3) &&
      Array.isArray(dati.categorie) && Array.isArray(dati.sottocategorie) &&
      Array.isArray(dati.sessioni) && dati.impostazioni && typeof dati.impostazioni === 'object';
    if (!valido) throw new Error('schema non valido');
    const vecchiaVersione = dati.schemaVersion;
    migra(dati);
    stato = dati;
    if (vecchiaVersione !== dati.schemaVersion) salva();
  } catch (err) {
    statoCorrotto = true;
    mostraRecupero(grezzo);
  }
}

function salva() {
  if (statoCorrotto) return;
  try {
    localStorage.setItem(CHIAVE, JSON.stringify(stato));
    if (erroreSalvataggio) { erroreSalvataggio = false; rendiBanner(); }
  } catch (err) {
    erroreSalvataggio = true;
    rendiBanner();
  }
}

/* ================= Ricerche ================= */
const trovaCat = (id) => stato.categorie.find((c) => c.id === id) || null;
const trovaSub = (id) => stato.sottocategorie.find((s) => s.id === id) || null;
const sottoDi = (catId) => stato.sottocategorie.filter((s) => s.categoriaId === catId);
const sessioneAttiva = () => stato.sessioni.find((s) => s.fine === null) || null;
const nSessioniCat = (catId) => stato.sessioni.filter((s) => s.categoriaId === catId).length;
const nSessioniSub = (subId) => stato.sessioni.filter((s) => s.sottocategoriaId === subId).length;

function etichettaSessione(s) {
  const cat = trovaCat(s.categoriaId);
  const sub = s.sottocategoriaId ? trovaSub(s.sottocategoriaId) : null;
  const nomeCat = cat ? cat.nome : 'Categoria eliminata';
  return sub ? nomeCat + ' · ' + sub.nome : nomeCat;
}

/* ================= Obiettivi settimanali ================= */
// La settimana 1 è quella (lun-dom) che contiene dataInizioPercorso.
// Math.round assorbe l'ora in più/in meno dei cambi di ora legale.
function settimanaDelPercorso(riferimento) {
  const a = inizioSettimana(new Date(stato.impostazioni.dataInizioPercorso));
  const b = inizioSettimana(riferimento);
  return Math.max(1, Math.round((b - a) / (7 * 86400000)) + 1);
}

// chiave: 'studio' (prima categoria investimento) o 'crescita' (seconda).
function targetPerSettimana(n, chiave) {
  const imp = stato.impostazioni;
  const rampa = Array.isArray(imp.rampa) ? imp.rampa : [];
  if (n <= rampa.length) return Number(rampa[n - 1]) || 0;
  return Number((imp.targetFinali || {})[chiave]) || 0;
}

// Somme della settimana (lun-dom) che contiene "riferimento": per categoria
// e totale delle sessioni con avvio "scivolato". Le sessioni a cavallo dei
// confini vengono ritagliate; quella attiva conta fino ad adesso.
function totaliSettimana(riferimento) {
  const ini = inizioSettimana(riferimento).getTime();
  const fin = fineSettimana(riferimento).getTime();
  const adesso = Date.now();
  const perCategoria = new Map();
  let scivolato = 0;
  for (const s of stato.sessioni) {
    const a = Date.parse(s.inizio);
    const b = s.fine ? Date.parse(s.fine) : adesso;
    const da = Math.max(a, ini);
    const fino = Math.min(b, fin);
    if (fino <= da) continue;
    const durata = fino - da;
    perCategoria.set(s.categoriaId, (perCategoria.get(s.categoriaId) || 0) + durata);
    if (s.avvio === 'scivolato') scivolato += durata;
  }
  return { perCategoria: perCategoria, scivolato: scivolato };
}

/* ================= Statistiche ================= */
function fmtOreMinuti(min) {
  return String(Math.floor(min / 60)).padStart(2, '0') + ':' + String(min % 60).padStart(2, '0');
}

// Ultime 8 settimane, dalla piu' vecchia alla corrente (parziale).
function trendSettimane() {
  const lun0 = inizioSettimana(new Date());
  const out = [];
  for (let k = 7; k >= 0; k--) {
    const rif = new Date(lun0.getFullYear(), lun0.getMonth(), lun0.getDate() - 7 * k);
    const tot = totaliSettimana(rif);
    let inv = 0, disp = 0;
    tot.perCategoria.forEach((ms, id) => {
      const c = trovaCat(id);
      if (c && c.tipo === 'investimento') inv += ms; else disp += ms;
    });
    out.push({ lunedi: rif, inv: inv, disp: disp, corrente: k === 0 });
  }
  return out;
}

// Scarto migliore-peggiore in ore di investimento, sulle ultime 8 settimane.
// La settimana corrente (parziale) e quelle senza alcun dato non contano.
function costanzaMs() {
  const setts = trendSettimane().filter((s) => !s.corrente && (s.inv + s.disp) > 0);
  if (setts.length < 2) return null;
  let mi = Infinity, ma = -Infinity;
  for (const s of setts) {
    if (s.inv < mi) mi = s.inv;
    if (s.inv > ma) ma = s.inv;
  }
  return ma - mi;
}

// Minuti dalla mezzanotte, in media, della prima sessione della categoria
// nei giorni degli ultimi 14 che ne hanno almeno una.
function oraMediaInizioMin(catId) {
  const oggi0 = inizioGiorno(new Date());
  const da = new Date(oggi0.getFullYear(), oggi0.getMonth(), oggi0.getDate() - 13).getTime();
  const primoPerGiorno = new Map();
  for (const s of stato.sessioni) {
    if (s.categoriaId !== catId) continue;
    const t = Date.parse(s.inizio);
    if (t < da) continue;
    const d = new Date(t);
    const g = aInputData(d);
    const min = d.getHours() * 60 + d.getMinutes();
    if (!primoPerGiorno.has(g) || min < primoPerGiorno.get(g)) primoPerGiorno.set(g, min);
  }
  if (primoPerGiorno.size === 0) return null;
  let somma = 0;
  primoPerGiorno.forEach((m) => { somma += m; });
  return Math.round(somma / primoPerGiorno.size);
}

// Tempo scivolato per fascia di 2 ore (0-2, 2-4, ... 22-24), su tutte le
// sessioni con avvio "scivolato". fascia e' l'indice del bucket piu' carico,
// oppure null sotto le 5 sessioni.
function statScivolato() {
  const buckets = new Array(12).fill(0);
  let n = 0;
  const adesso = Date.now();
  for (const s of stato.sessioni) {
    if (s.avvio !== 'scivolato') continue;
    n++;
    let t = Date.parse(s.inizio);
    const fine = s.fine ? Date.parse(s.fine) : adesso;
    let guardia = 0;
    while (t < fine && guardia < 5000) {
      guardia++;
      const d = new Date(t);
      const idx = Math.floor(d.getHours() / 2);
      const oreConfine = (idx + 1) * 2;
      const confine = (oreConfine >= 24)
        ? new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1, 0).getTime()
        : new Date(d.getFullYear(), d.getMonth(), d.getDate(), oreConfine).getTime();
      const fino = Math.min(fine, confine);
      buckets[idx] += fino - t;
      t = fino;
    }
  }
  if (n < 5) return { n: n, fascia: null, buckets: buckets };
  let best = 0;
  for (let i = 1; i < 12; i++) if (buckets[i] > buckets[best]) best = i;
  return { n: n, fascia: best, buckets: buckets };
}

/* ================= Review settimanale ================= */
// La settimana candidabile: la corrente se oggi e' domenica, altrimenti
// quella appena conclusa. Le piu' vecchie non vengono mai riproposte.
function candidataReview() {
  const oggi = new Date();
  const lun = inizioSettimana(oggi);
  if (oggi.getDay() === 0) return lun;
  return new Date(lun.getFullYear(), lun.getMonth(), lun.getDate() - 7);
}

/* ================= Azioni sul timer ================= */
function avviaSessione(categoriaId, sottocategoriaId, avvio) {
  const adesso = new Date().toISOString();
  const attiva = sessioneAttiva();
  if (attiva) attiva.fine = adesso; // cambio rapido: la sessione in corso si chiude qui
  stato.sessioni.push({
    id: nuovoId(),
    inizio: adesso,
    fine: null,
    categoriaId: categoriaId,
    sottocategoriaId: sottocategoriaId || null,
    avvio: avvio || null,
    nota: ''
  });
  salva();
  rendi();
}

function fermaSessione() {
  const attiva = sessioneAttiva();
  if (!attiva) return;
  attiva.fine = new Date().toISOString();
  salva();
  chiudiFocus();
  rendi();
}

function richiediAvvio(categoriaId, sottocategoriaId) {
  const cat = trovaCat(categoriaId);
  if (!cat) return;
  if (cat.tipo === 'dispersione') apriModaleAvvio(cat, sottocategoriaId || null);
  else avviaSessione(categoriaId, sottocategoriaId || null, null);
}

/* ================= Sovrapposizioni e ritagli giornalieri ================= */
function trovaSovrapposizione(iniMs, finMs, escludiId) {
  const adesso = Date.now();
  for (const s of stato.sessioni) {
    if (s.id === escludiId) continue;
    const a = Date.parse(s.inizio);
    const b = s.fine ? Date.parse(s.fine) : adesso;
    if (iniMs < b && finMs > a) return s;
  }
  return null;
}

function messaggioConflitto(conflitto) {
  const cIni = new Date(conflitto.inizio);
  const cFin = conflitto.fine ? fmtOra(new Date(conflitto.fine)) : 'in corso';
  return 'Si sovrappone a "' + etichettaSessione(conflitto) + '" del ' +
    fmtDataBreve(cIni) + ' (' + fmtOra(cIni) + ' – ' + cFin + ').';
}

// Una sessione resta unica nel modello: qui viene solo ritagliata
// sulla finestra del giorno richiesto, per timeline e conteggi.
function ritagliGiorno(giorno) {
  const ini = inizioGiorno(giorno).getTime();
  const fin = fineGiorno(giorno).getTime();
  const adesso = Date.now();
  const out = [];
  for (const s of stato.sessioni) {
    const sIni = Date.parse(s.inizio);
    const sFin = s.fine ? Date.parse(s.fine) : adesso;
    const da = Math.max(sIni, ini);
    const fino = Math.min(sFin, fin);
    if (fino <= da) continue;
    out.push({
      sessione: s,
      da: da,
      fino: fino,
      iniziataPrima: sIni < ini,
      continuaDopo: (s.fine !== null && sFin > fin) || (s.fine === null && adesso >= fin),
      inCorso: s.fine === null && adesso < fin
    });
  }
  out.sort((x, y) => x.da - y.da);
  return out;
}

/* ================= Avvio rapido ================= */
function chiaveUnita(catId, subId) { return catId + '|' + (subId || ''); }

function unitaQuickStart() {
  const soglia = Date.now() - QUATTORDICI_GIORNI_MS;
  const adesso = Date.now();
  const totali = new Map();
  for (const s of stato.sessioni) {
    const ini = Date.parse(s.inizio);
    if (ini < soglia) continue;
    if (!trovaCat(s.categoriaId)) continue;
    if (s.sottocategoriaId && !trovaSub(s.sottocategoriaId)) continue;
    const fin = s.fine ? Date.parse(s.fine) : adesso;
    const k = chiaveUnita(s.categoriaId, s.sottocategoriaId);
    totali.set(k, (totali.get(k) || 0) + Math.max(0, fin - ini));
  }
  const scelte = [...totali.entries()].sort((x, y) => y[1] - x[1]).map((e) => e[0]).slice(0, 3);
  if (scelte.length < 3) {
    for (const sub of stato.sottocategorie) {
      const k = chiaveUnita(sub.categoriaId, sub.id);
      if (!scelte.includes(k)) scelte.push(k);
      if (scelte.length === 3) break;
    }
  }
  if (scelte.length < 3) {
    for (const cat of stato.categorie) {
      if (sottoDi(cat.id).length > 0) continue;
      const k = chiaveUnita(cat.id, null);
      if (!scelte.includes(k)) scelte.push(k);
      if (scelte.length === 3) break;
    }
  }
  return scelte.slice(0, 3);
}

      }

function rendiGiorno() {

  const eOggi = stessoGiorno(giornoVista, new Date());
  const ritagli = ritagliGiorno(giornoVista);

  let totInv = 0, totDisp = 0;
  const perCategoria = new Map();
  for (const r of ritagli) {
    const cat = trovaCat(r.sessione.categoriaId);
    const durata = r.fino - r.da;
    if (cat && cat.tipo === 'investimento') totInv += durata; else totDisp += durata;
    perCategoria.set(r.sessione.categoriaId, (perCategoria.get(r.sessione.categoriaId) || 0) + durata);
  }
  const msSveglio = (Number(stato.impostazioni.oreSveglio) || 16) * 3600000;
  const nonReg = Math.max(0, msSveglio - totInv - totDisp);

    '<div class="testa-giorno">' +

    '<div class="barra-ore">' +

      '<span><span class="pallino" style="background:var(--grigio)"></span>Non registrato ' + fmtDurata(nonReg) + '</span>' +
    '</div>';

    for (const riga of righe) {

function rendiSettimana() {
  const el = $('#vista-settimana');
  const imp = stato.impostazioni;
  const rif = new Date();
  const ini = inizioSettimana(rif);
  const dom = new Date(ini.getFullYear(), ini.getMonth(), ini.getDate() + 6);
  const nSett = settimanaDelPercorso(rif);
  const tot = totaliSettimana(rif);

  let html =
    '<div class="testa-giorno"><div class="data">' + esc(fmtDataBreve(ini)) + ' – ' + esc(fmtDataBreve(dom)) + '</div></div>' +
    '<div class="setti-n">settimana ' + nSett + ' del percorso</div>' +
    '<div class="micro">Obiettivi</div>';

  const catObiettivo = stato.categorie.filter((c) => c.tipo === 'investimento').slice(0, 2);
  const chiavi = ['studio', 'crescita'];
  if (catObiettivo.length === 0) {
    html += '<div class="vuoto">Nessuna categoria di tipo investimento.</div>';
  }
  catObiettivo.forEach((cat, i) => {
    const oreTarget = targetPerSettimana(nSett, chiavi[i]);
    const finale = Number((imp.targetFinali || {})[chiavi[i]]) || 0;
    const x = tot.perCategoria.get(cat.id) || 0;
    const pct = oreTarget > 0 ? Math.min(100, x / (oreTarget * 3600000) * 100) : 0;
    html +=
      '<div class="obiettivo">' +
        '<div class="obiettivo-testa">' +
          '<span class="pallino" style="background:' + esc(cat.colore) + '"></span>' +
          '<span class="nome">' + esc(cat.nome) + '</span>' +
          '<span class="valori">' + fmtDurata(x) + ' di ' + oreTarget + ' ore</span>' +
        '</div>' +
        '<div class="barra-ore barra-obiettivo"><div class="seg" style="width:' + pct.toFixed(2) + '%;background:' + esc(cat.colore) + '"></div></div>' +
        '<div class="obiettivo-sotto">obiettivo finale: ' + finale + ' ore</div>' +
      '</div>';
  });

  const tetto = Number(imp.tettoScivolato) || 0;
  const xs = tot.scivolato;
  const pctS = tetto > 0 ? Math.min(100, xs / (tetto * 3600000) * 100) : 0;
  html +=
    '<div class="micro">Tetto</div>' +
    '<div class="obiettivo">' +
      '<div class="obiettivo-testa">' +
        '<span class="pallino" style="background:var(--disp)"></span>' +
        '<span class="nome">Dispersione scivolata</span>' +
        '<span class="valori">' + fmtDurata(xs) + ' · tetto ' + tetto + ' ore</span>' +
      '</div>' +
      '<div class="barra-ore barra-obiettivo"><div class="seg" style="width:' + pctS.toFixed(2) + '%;background:var(--disp)"></div></div>' +
    '</div>';

  html += htmlTrend() + htmlStatistiche() + htmlReview() + htmlBackup();
  el.innerHTML = html;
}

function htmlTrend() {
  const setts = trendSettimane();
  let max = 0;
  for (const s of setts) max = Math.max(max, s.inv, s.disp);
  let colonne = '';
  for (const s of setts) {
    let barre = '';
    if (max > 0) {
      if (s.inv > 0) barre += '<div class="trend-barra" style="height:' + (s.inv / max * 100).toFixed(1) + '%;background:var(--inv)"></div>';
      if (s.disp > 0) barre += '<div class="trend-barra" style="height:' + (s.disp / max * 100).toFixed(1) + '%;background:var(--disp)"></div>';
    }
    const eti = s.lunedi.getDate() + '/' + (s.lunedi.getMonth() + 1);
    colonne += '<div class="trend-col"><div class="trend-area">' + barre + '</div><div class="trend-eti">' + eti + '</div></div>';
  }
  return '<div class="micro">Ultime 8 settimane</div>' +
    '<div class="trend">' + colonne + '</div>' +
    '<div class="legenda">' +
      '<span><span class="pallino" style="background:var(--inv)"></span>Investimento</span>' +
      '<span><span class="pallino" style="background:var(--disp)"></span>Dispersione</span>' +
    '</div>';
}

function htmlStatistiche() {
  const riga = (etichetta, valore) =>
    '<div class="tot-riga"><span>' + etichetta + '</span><span class="durata">' + valore + '</span></div>';
  const cost = costanzaMs();
  const catStudio = stato.categorie.filter((c) => c.tipo === 'investimento')[0] || null;
  const media = catStudio ? oraMediaInizioMin(catStudio.id) : null;
  const sciv = statScivolato();
  return '<div class="micro">Statistiche</div><div class="pannello">' +
    riga('costanza', cost === null ? '&mdash;' : fmtDurata(cost)) +
    riga('inizio medio' + (catStudio ? ' &middot; ' + esc(catStudio.nome) : ''), media === null ? '&mdash;' : fmtOreMinuti(media)) +
    riga('fascia scivolato', sciv.fascia === null ? 'dati insufficienti' : (sciv.fascia * 2) + '&ndash;' + (sciv.fascia * 2 + 2)) +
  '</div>';
}

function htmlReview() {
  const cand = candidataReview();
  const chiave = aInputData(cand);
  const compilata = stato.reviews.some((r) => r.settimana === chiave);
  if (compilata && stato.reviews.length === 0) return '';
  let html = '';
  const dom6 = new Date(cand.getFullYear(), cand.getMonth(), cand.getDate() + 6);
  if (!compilata || stato.reviews.length > 0) html += '<div class="micro">Review</div>';
  if (!compilata) {
    html += '<div><button class="btn-piccolo" data-review-scrivi>Review &middot; ' +
      esc(fmtDataBreve(cand)) + ' &ndash; ' + esc(fmtDataBreve(dom6)) + '</button></div>';
  }
  const ordinate = [...stato.reviews].sort((a, b) => (a.settimana < b.settimana ? 1 : -1));
  for (const r of ordinate) {
    const lun = new Date(r.settimana + 'T00:00');
    const dom = new Date(lun.getFullYear(), lun.getMonth(), lun.getDate() + 6);
    let campi = '';
    const coppie = [
      ['Cosa ha funzionato questa settimana', r.funzionato],
      ['Cosa mi ha fatto scivolare', r.scivolare],
      ['Una cosa sola che cambio la prossima settimana', r.cambio]
    ];
    for (const c of coppie) {
      if (!c[1]) continue;
      campi += '<div class="review-q">' + esc(c[0]) + '</div><div class="review-a">' + esc(c[1]) + '</div>';
    }
    html += '<div class="pannello review-card">' +
      '<div class="review-range">' + esc(fmtDataBreve(lun)) + ' &ndash; ' + esc(fmtDataBreve(dom)) + '</div>' +
      campi + '</div>';
  }
  return html;
}

function htmlBackup() {
  const ub = stato.impostazioni.ultimoBackup;
  return '<div class="riga-backup">ultimo backup: ' + (ub ? esc(fmtDataBreve(new Date(ub))) : 'mai') + '</div>';
}

function apriModaleModifica(idSessione) {
  const s = stato.sessioni.find((x) => x.id === idSessione);
  if (!s) return;
  const eAttiva = s.fine === null;
  const inizioOrig = new Date(s.inizio);
  const fineOrig = s.fine ? new Date(s.fine) : null;

  const opzioniCat = stato.categorie.map((c) =>
    '<option value="' + esc(c.id) + '"' + (c.id === s.categoriaId ? ' selected' : '') + '>' + esc(c.nome) + '</option>'
  ).join('');

  const m = apriModale(
    '<h2>Correggi sessione</h2>' +
    (eAttiva ? '<p class="sotto-titolo">Sessione in corso: lascia vuota la fine per farla continuare.</p>' : '') +
    '<div class="campo"><label>Inizio</label><input type="datetime-local" data-c-inizio value="' + aInputDataOra(inizioOrig) + '"></div>' +
    '<div class="campo"><label>Fine</label><input type="datetime-local" data-c-fine value="' + (fineOrig ? aInputDataOra(fineOrig) : '') + '"></div>' +
    '<div class="campo"><label>Categoria</label><select data-c-cat>' + opzioniCat + '</select></div>' +
    '<div class="campo"><label>Sottocategoria</label><select data-c-sub></select></div>' +
    '<div class="campo" data-riga-avvio hidden><label>Avvio</label><div class="segmentato">' +
      '<button type="button" data-c-avvio="deciso">L&#39;ho scelto</button>' +
      '<button type="button" data-c-avvio="scivolato">Ci sono finito dentro</button>' +
    '</div></div>' +
    '<div class="campo"><label>Nota</label><textarea rows="2" data-c-nota>' + esc(s.nota) + '</textarea></div>' +
    '<div class="errore" data-c-errore hidden></div>' +
    '<div class="riga-bottoni">' +
      '<button class="btn btn-rischio" data-c-elimina>Elimina</button>' +
      '<span class="spinta"></span>' +
      '<button class="btn btn-fantasma" data-annulla>Annulla</button>' +
      '<button class="btn btn-primario" data-c-salva>Salva</button>' +
    '</div>'
  );

  let avvioSel = s.avvio;
  const selCat = m.querySelector('[data-c-cat]');
  const selSub = m.querySelector('[data-c-sub]');
  const rigaAvvio = m.querySelector('[data-riga-avvio]');

  function aggiornaSub() {
    const subs = sottoDi(selCat.value);
    let opts = '<option value="">— nessuna —</option>';
    for (const sub of subs) {
      opts += '<option value="' + esc(sub.id) + '"' + (sub.id === s.sottocategoriaId ? ' selected' : '') + '>' + esc(sub.nome) + '</option>';
    }
    selSub.innerHTML = opts;
    selSub.disabled = subs.length === 0;
  }
  function aggiornaAvvio() {
    const cat = trovaCat(selCat.value);
    const serve = !!(cat && cat.tipo === 'dispersione');
    rigaAvvio.hidden = !serve;
    m.querySelectorAll('[data-c-avvio]').forEach((b) =>
      b.classList.toggle('sel', serve && b.dataset.cAvvio === avvioSel));
  }
  selCat.addEventListener('change', () => { aggiornaSub(); aggiornaAvvio(); });
  m.querySelectorAll('[data-c-avvio]').forEach((b) => b.addEventListener('click', () => {
    avvioSel = b.dataset.cAvvio;
    aggiornaAvvio();
  }));
  aggiornaSub();
  aggiornaAvvio();

  function mostraErrore(t) {
    const e = m.querySelector('[data-c-errore]');
    e.textContent = t;
    e.hidden = false;
  }

  m.querySelector('[data-annulla]').addEventListener('click', chiudiModale);

  m.querySelector('[data-c-elimina]').addEventListener('click', () => {
    apriConferma('Eliminare questa sessione?', () => {
      stato.sessioni = stato.sessioni.filter((x) => x.id !== s.id);
      salva();
      rendi();
      mostraUndo(s);
    }, 'Elimina', () => apriModaleModifica(idSessione));
  });

  m.querySelector('[data-c-salva]').addEventListener('click', () => {
    const vIni = m.querySelector('[data-c-inizio]').value;
    const vFin = m.querySelector('[data-c-fine]').value;
    if (!vIni) { mostraErrore('Inserisci l\'ora di inizio.'); return; }

    // Se un campo non è stato toccato, si conservano i secondi originali:
    // evita falsi conflitti con sessioni adiacenti al minuto.
    const nInizio = (vIni === aInputDataOra(inizioOrig)) ? inizioOrig : new Date(vIni);
    let nFine = null;
    if (vFin === '') {
      if (!eAttiva) { mostraErrore('Inserisci l\'ora di fine.'); return; }
    } else {
      nFine = (fineOrig && vFin === aInputDataOra(fineOrig)) ? fineOrig : new Date(vFin);
    }
    if (isNaN(nInizio.getTime()) || (nFine && isNaN(nFine.getTime()))) { mostraErrore('Data non valida.'); return; }

    const limiteFuturo = Date.now() + 60000; // un minuto di tolleranza sull'orologio
    if (nInizio.getTime() > limiteFuturo) { mostraErrore('L\'inizio non può essere nel futuro.'); return; }
    if (nFine) {
      if (nFine.getTime() <= nInizio.getTime()) { mostraErrore('L\'ora di fine deve essere successiva all\'inizio.'); return; }
      if (nFine.getTime() > limiteFuturo) { mostraErrore('L\'ora di fine non può essere nel futuro.'); return; }
    }

    const conflitto = trovaSovrapposizione(nInizio.getTime(), nFine ? nFine.getTime() : Date.now(), s.id);
    if (conflitto) { mostraErrore(messaggioConflitto(conflitto)); return; }

    const catSel = trovaCat(selCat.value);
    if (!catSel) { mostraErrore('Categoria non valida.'); return; }
    let nAvvio = null;
    if (catSel.tipo === 'dispersione') {
      if (avvioSel !== 'deciso' && avvioSel !== 'scivolato') { mostraErrore('Indica come è iniziata la sessione.'); return; }
      nAvvio = avvioSel;
    }

    s.inizio = nInizio.toISOString();
    s.fine = nFine ? nFine.toISOString() : null;
    s.categoriaId = catSel.id;
    s.sottocategoriaId = selSub.value || null;
    s.avvio = nAvvio;
    s.nota = m.querySelector('[data-c-nota]').value.trim();
    salva();
    chiudiModale();
    rendi();
  });
}

function apriModaleVecchio(sessione) {
  avvisoVecchioMostrato = true;
  const inizio = new Date(sessione.inizio);
  const quando = stessoGiorno(inizio, new Date()) ? 'oggi' : 'il ' + fmtDataBreve(inizio);
  const m = apriModale(
    '<h2>Timer attivo da più di 6 ore</h2>' +
    '<p class="sotto-titolo">La sessione "' + esc(etichettaSessione(sessione)) + '" è partita ' +
    esc(quando) + ' alle ' + fmtOra(inizio) +
    '. Probabilmente il timer è rimasto acceso: correggi l\'ora di fine invece di tenere tutto il tempo trascorso.</p>' +
    '<div class="campo"><label>Fine effettiva</label><input type="datetime-local" data-v-fine value="' + aInputDataOra(new Date()) + '"></div>' +
    '<div class="errore" data-v-errore hidden></div>' +
    '<div class="riga-bottoni">' +
      '<button class="btn btn-fantasma" data-v-continua>Il timer è giusto, continua</button>' +
      '<button class="btn btn-primario" data-v-salva>Chiudi la sessione qui</button>' +
    '</div>'
  );
  m.querySelector('[data-v-continua]').addEventListener('click', chiudiModale);
  m.querySelector('[data-v-salva]').addEventListener('click', () => {
    const err = (t) => {
      const e = m.querySelector('[data-v-errore]');
      e.textContent = t;
      e.hidden = false;
    };
    const v = m.querySelector('[data-v-fine]').value;
    if (!v) { err('Inserisci l\'ora di fine.'); return; }
    const nFine = new Date(v);
    if (isNaN(nFine.getTime())) { err('Data non valida.'); return; }
    if (nFine.getTime() <= Date.parse(sessione.inizio)) { err('La fine deve essere successiva all\'inizio (' + fmtDataBreve(new Date(sessione.inizio)) + ', ' + fmtOra(new Date(sessione.inizio)) + ').'); return; }
    if (nFine.getTime() > Date.now() + 60000) { err('La fine non può essere nel futuro.'); return; }
    const conflitto = trovaSovrapposizione(Date.parse(sessione.inizio), nFine.getTime(), sessione.id);
    if (conflitto) { err(messaggioConflitto(conflitto)); return; }
    sessione.fine = nFine.toISOString();
    salva();
    chiudiModale();
    rendi();
  });
}

function controllaTimerVecchio() {
  if (statoCorrotto || avvisoVecchioMostrato) return;
  const attiva = sessioneAttiva();
  if (attiva && Date.now() - Date.parse(attiva.inizio) > SEI_ORE_MS) apriModaleVecchio(attiva);

/* ================= Undo eliminazione ================= */
let undoSessione = null;
let timerUndo = 0;

function mostraUndo(sessione) {
  undoSessione = sessione;
  const el = $('#undo');
  el.classList.remove('undo-uscita');
  el.hidden = false;
  clearTimeout(timerUndo);
  timerUndo = setTimeout(nascondiUndo, 5000);
}

function nascondiUndo() {
  clearTimeout(timerUndo);
  undoSessione = null;
  const el = $('#undo');
  if (el.hidden) return;
  el.classList.add('undo-uscita');
  setTimeout(() => { el.hidden = true; el.classList.remove('undo-uscita'); }, 220);
}

function annullaEliminazione() {
  if (!undoSessione) return;
  const s = undoSessione;
  const finMs = s.fine ? Date.parse(s.fine) : Date.now();
  const conflitto = trovaSovrapposizione(Date.parse(s.inizio), finMs, s.id);
  nascondiUndo();
  if (conflitto) {
    apriInfo('Impossibile annullare', 'Nel frattempo un\'altra sessione occupa quell\'intervallo: ' + messaggioConflitto(conflitto));
    return;
  }
  stato.sessioni.push(s);
  salva();
  rendi();
}

            '<option value="dispersione"' + (cat.tipo === 'dispersione' ? ' selected' : '') + '>dispersione</option>' +
          '</select>' +
          '<button class="btn-x" data-i-elimina-cat="' + esc(cat.id) + '" aria-label="Elimina categoria">✕</button>' +
        '</div>';
    for (const sub of sottoDi(cat.id)) {
      html +=
        '<div class="imp-sub">' +
          '<input type="text" data-i-sub-nome="' + esc(sub.id) + '" value="' + esc(sub.nome) + '" aria-label="Nome sottocategoria">' +
          '<button class="btn-x" data-i-elimina-sub="' + esc(sub.id) + '" aria-label="Elimina sottocategoria">✕</button>' +
        '</div>';
    }
    html +=
      '<div class="imp-sub">' +
        '<input type="text" placeholder="Nuova sottocategoria" data-i-sub-nuova="' + esc(cat.id) + '">' +
        '<button class="btn-piccolo" data-i-sub-aggiungi="' + esc(cat.id) + '">Aggiungi</button>' +
      '</div></div>';
  }

  html +=
    '<div class="imp-riga"><button class="btn-piccolo" data-i-cat-aggiungi>+ Nuova categoria</button></div>' +
    '<div class="micro">Dati</div>' +
    '<div class="imp-riga">' +
      '<button class="btn-piccolo" data-i-esporta>Esporta dati (JSON)</button>' +
      '<button class="btn-piccolo" data-i-esporta-csv>Esporta CSV</button>' +
      '<button class="btn-piccolo" data-i-importa>Importa dati (JSON)</button>' +
      '<input type="file" accept=".json,application/json" data-i-file hidden>' +
    '</div>' +
    '<div class="riga-bottoni"><button class="btn btn-primario" data-i-chiudi>Chiudi</button></div>';

  corpo.innerHTML = html;
}

// Attaccati UNA volta per apertura del pannello: rendiImpostazioni può
// ridisegnare il contenuto senza duplicare i listener.
function attaccaEventiImpostazioni(corpo) {
  corpo.addEventListener('change', (e) => {
    const t = e.target;
    if (t.matches('[data-i-ore]')) {
      const v = Math.min(24, Math.max(1, parseInt(t.value, 10) || 16));
      stato.impostazioni.oreSveglio = v;
      t.value = v;
      salva();
    } else if (t.matches('[data-i-data]')) {
      if (t.value) {
        stato.impostazioni.dataInizioPercorso = new Date(t.value + 'T00:00').toISOString();
        salva();
      }
    } else if (t.matches('[data-i-colore]')) {
      const c = trovaCat(t.dataset.iColore);
      if (c) { c.colore = t.value; salva(); }
    } else if (t.matches('[data-i-nome]')) {
      const c = trovaCat(t.dataset.iNome);
      if (c) {
        const v = t.value.trim();
        if (v) c.nome = v; else t.value = c.nome;
        salva();
      }
    } else if (t.matches('[data-i-tipo]')) {
      const c = trovaCat(t.dataset.iTipo);
      if (c) { c.tipo = t.value; salva(); }
    } else if (t.matches('[data-i-sub-nome]')) {
      const sub = trovaSub(t.dataset.iSubNome);
      if (sub) {
        const v = t.value.trim();
        if (v) sub.nome = v; else t.value = sub.nome;
        salva();
      }
    } else if (t.matches('[data-i-file]')) {
      const file = t.files && t.files[0];
      t.value = '';
      if (!file) return;
      const lettore = new FileReader();
      lettore.onload = () => gestisciImport(String(lettore.result));
      lettore.onerror = () => apriInfo('Importazione rifiutata', 'Impossibile leggere il file.');
      lettore.readAsText(file);
    }
  });

  corpo.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.matches('[data-i-chiudi]')) { chiudiModale(); rendi(); return; }
    if (b.matches('[data-i-esporta]')) { esportaJson(); return; }
    if (b.matches('[data-i-esporta-csv]')) { esportaCsv(); return; }
    if (b.matches('[data-i-importa]')) {
      const campo = corpo.querySelector('[data-i-file]');
      if (campo) campo.click();
      return;
    }
    if (b.matches('[data-i-sub-aggiungi]')) {
      const catId = b.dataset.iSubAggiungi;
      const campo = corpo.querySelector('[data-i-sub-nuova="' + catId + '"]');
      const nome = campo ? campo.value.trim() : '';
      if (!nome) return;
      stato.sottocategorie.push({ id: nuovoId(), categoriaId: catId, nome: nome });
      salva();
      rendiImpostazioni(corpo);
      return;
    }
    if (b.matches('[data-i-cat-aggiungi]')) {
      stato.categorie.push({ id: nuovoId(), nome: 'Nuova categoria', colore: '#8a8378', tipo: 'investimento' });
      salva();
      rendiImpostazioni(corpo);
      return;
    }
    if (b.matches('[data-i-elimina-cat]')) {
      const id = b.dataset.iEliminaCat;
      const cat = trovaCat(id);
      if (!cat) return;
      const n = nSessioniCat(id);
      if (n > 0) {
        apriAvvisoImpostazioni('"' + cat.nome + '" ha ' + n + ' sessioni registrate e non può essere eliminata. Elimina prima le sessioni o riassegnale a un\'altra categoria.');
        return;
      }
      apriConferma('Eliminare la categoria "' + cat.nome + '" e le sue sottocategorie?', () => {
        stato.categorie = stato.categorie.filter((c) => c.id !== id);
        stato.sottocategorie = stato.sottocategorie.filter((sc) => sc.categoriaId !== id);
        salva();
        apriModaleImpostazioni();
      }, 'Elimina', apriModaleImpostazioni);
      return;
    }
    if (b.matches('[data-i-elimina-sub]')) {
      const id = b.dataset.iEliminaSub;
      const sub = trovaSub(id);
      if (!sub) return;
      const n = nSessioniSub(id);
      if (n > 0) {
        apriAvvisoImpostazioni('"' + sub.nome + '" è usata in ' + n + ' sessioni e non può essere eliminata. Riassegna prima quelle sessioni.');
        return;
      }
      stato.sottocategorie = stato.sottocategorie.filter((sc) => sc.id !== id);
      salva();
      rendiImpostazioni(corpo);
      return;
    }
  });
}

function apriAvvisoImpostazioni(messaggio) {
  const m = apriModale(
    '<h2>Impossibile eliminare</h2>' +
    '<p class="sotto-titolo">' + esc(messaggio) + '</p>' +
    '<div class="riga-bottoni"><button class="btn btn-primario" data-ok>Ok</button></div>'
  );
  m.querySelector('[data-ok]').addEventListener('click', apriModaleImpostazioni);
}

/* ================= Esportazione e recupero ================= */
function scaricaFile(nome, contenuto, tipo) {
  const blob = new Blob([contenuto], { type: tipo });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nome;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

function esportaJson() {
  scaricaFile('tempo-' + aInputData(new Date()) + '.json', JSON.stringify(stato, null, 2), 'application/json');
  stato.impostazioni.ultimoBackup = new Date().toISOString();
  salva();
  rendi();
}

function csvCampo(v) {
  v = String(v == null ? '' : v);
  return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}

function righeCsv() {
  const righe = ['data,ora inizio,ora fine,durata minuti,categoria,sottocategoria,avvio,nota'];
  const ordinate = [...stato.sessioni].sort((a, b) => Date.parse(a.inizio) - Date.parse(b.inizio));
  for (const s of ordinate) {
    const ini = new Date(s.inizio);
    const fin = s.fine ? new Date(s.fine) : null;
    const durata = Math.round(((fin ? fin.getTime() : Date.now()) - ini.getTime()) / 60000);
    const cat = trovaCat(s.categoriaId);
    const sub = s.sottocategoriaId ? trovaSub(s.sottocategoriaId) : null;
    righe.push([
      aInputData(ini), fmtOra(ini), fin ? fmtOra(fin) : '', durata,
      cat ? cat.nome : '', sub ? sub.nome : '', s.avvio || '', s.nota || ''
    ].map(csvCampo).join(','));
  }
  return righe.join('\r\n');
}

function esportaCsv() {
  scaricaFile('tempo-sessioni-' + aInputData(new Date()) + '.csv', '\uFEFF' + righeCsv(), 'text/csv;charset=utf-8');
}

// Ritorna null se i dati sono importabili, altrimenti il motivo del rifiuto.
function validaImport(dati) {
  if (!dati || typeof dati !== 'object' || Array.isArray(dati)) return 'Il contenuto non \u00e8 un oggetto di dati.';
  if (dati.schemaVersion !== 1 && dati.schemaVersion !== 2 && dati.schemaVersion !== 3) return 'schemaVersion mancante o non supportata (attese: 1, 2 o 3).';
  if (!Array.isArray(dati.categorie)) return '"categorie" non \u00e8 un elenco.';
  if (!Array.isArray(dati.sottocategorie)) return '"sottocategorie" non \u00e8 un elenco.';
  if (!Array.isArray(dati.sessioni)) return '"sessioni" non \u00e8 un elenco.';
  if (!dati.impostazioni || typeof dati.impostazioni !== 'object') return '"impostazioni" mancante.';
  const idCat = new Set();
  for (let i = 0; i < dati.categorie.length; i++) {
    const c = dati.categorie[i];
    if (!c || !c.id || !c.nome) return 'categoria ' + (i + 1) + ': manca id o nome.';
    if (c.tipo !== 'investimento' && c.tipo !== 'dispersione') return 'categoria "' + c.nome + '": tipo non valido.';
    idCat.add(c.id);
  }
  const idSub = new Set();
  for (let i = 0; i < dati.sottocategorie.length; i++) {
    const sc = dati.sottocategorie[i];
    if (!sc || !sc.id || !sc.nome) return 'sottocategoria ' + (i + 1) + ': manca id o nome.';
    if (!idCat.has(sc.categoriaId)) return 'sottocategoria "' + sc.nome + '": categoria inesistente.';
    idSub.add(sc.id);
  }
  for (let i = 0; i < dati.sessioni.length; i++) {
    const s = dati.sessioni[i];
    if (!s || !s.id) return 'sessione ' + (i + 1) + ': manca id.';
    const ini = Date.parse(s.inizio);
    if (isNaN(ini)) return 'sessione ' + (i + 1) + ': inizio non valido.';
    if (s.fine != null) {
      const fin = Date.parse(s.fine);
      if (isNaN(fin)) return 'sessione ' + (i + 1) + ': fine non valida.';
      if (fin <= ini) return 'sessione ' + (i + 1) + ': fine non successiva all\'inizio.';
    }
    if (!idCat.has(s.categoriaId)) return 'sessione ' + (i + 1) + ': categoria inesistente.';
    if (s.sottocategoriaId != null && !idSub.has(s.sottocategoriaId)) return 'sessione ' + (i + 1) + ': sottocategoria inesistente.';
    if (s.avvio != null && s.avvio !== 'deciso' && s.avvio !== 'scivolato') return 'sessione ' + (i + 1) + ': avvio non valido.';
  }
  if (dati.reviews !== undefined && !Array.isArray(dati.reviews)) return '"reviews" non \u00e8 un elenco.';
  return null;
}

function gestisciImport(testo) {
  let dati = null;
  try {
    dati = JSON.parse(testo);
  } catch (err) {
    apriInfo('Importazione rifiutata', 'Il file non \u00e8 JSON valido: ' + err.message + '. I dati attuali non sono stati toccati.');
    return;
  }
  const errore = validaImport(dati);
  if (errore) {
    apriInfo('Importazione rifiutata', errore + ' I dati attuali non sono stati toccati.');
    return;
  }
  apriConferma('Sostituire i dati attuali (' + stato.sessioni.length + ' sessioni) con quelli del file (' + dati.sessioni.length + ' sessioni)?', () => {
    migra(dati);
    stato = dati;
    salva();
    rendi();
    apriInfo('Importazione completata', 'Sessioni caricate: ' + stato.sessioni.length + '.');
  }, 'Sostituisci', apriModaleImpostazioni);
}

function mostraRecupero(grezzo) {
  document.body.innerHTML =
    '<main><div class="pannello" style="margin-top:24px;padding:22px">' +
      '<h2>Dati non leggibili</h2>' +
      '<p style="color:var(--testo2)">I dati salvati in questo browser non sono in un formato leggibile. ' +
      'Puoi scaricarne una copia grezza prima di decidere se azzerare tutto.</p>' +
      '<textarea readonly rows="8" style="width:100%" id="rec-grezzo"></textarea>' +
      '<div class="riga-bottoni" style="justify-content:flex-start">' +
        '<button class="btn" id="rec-scarica">Scarica copia grezza</button>' +
        '<button class="btn btn-rischio" id="rec-reset">Azzera e ricomincia</button>' +
      '</div>' +
    '</div></main>';
  $('#rec-grezzo').value = grezzo;
  $('#rec-scarica').addEventListener('click', () => scaricaFile('tt_v1-grezzo.txt', grezzo, 'text/plain'));
  $('#rec-reset').addEventListener('click', () => {
    if (!window.confirm('Cancellare definitivamente i dati salvati e ripartire da zero?')) return;
    try { localStorage.setItem(CHIAVE, JSON.stringify(statoDefault())); } catch (err) {}
    location.reload();
  });
}

/* ================= Schermata di attrito ================= */
// L'app apre questa schermata SOLO se l'URL contiene ?trigger=<id> e quella
// categoria è di tipo dispersione. In ogni altro caso funziona identica.
function leggiTrigger() {
  try {
    const id = new URLSearchParams(location.search).get('trigger');
    if (!id) return null;
    const cat = trovaCat(id);
    return (cat && cat.tipo === 'dispersione') ? cat : null;
  } catch (err) { return null; }
}

function pulisciTrigger() {
  try {
    const u = new URL(location.href);
    if (!u.searchParams.has('trigger')) return;
    u.searchParams.delete('trigger');
    const coda = u.searchParams.toString();
    history.replaceState(null, '', u.pathname + (coda ? '?' + coda : '') + u.hash);
  } catch (err) {}
}

let timerConto = 0;
function apriAttrito(cat) {
  const el = $('#attrito');
  const imp = stato.impostazioni;
  const rif = new Date();
  const nSett = settimanaDelPercorso(rif);
  const tot = totaliSettimana(rif);

  let righe = '';
  const catObiettivo = stato.categorie.filter((c) => c.tipo === 'investimento').slice(0, 2);
  const chiavi = ['studio', 'crescita'];
  catObiettivo.forEach((c, i) => {
    const ore = targetPerSettimana(nSett, chiavi[i]);
    const x = tot.perCategoria.get(c.id) || 0;
    const mancano = Math.max(0, ore * 3600000 - x);
    righe +=
      '<div class="tot-riga">' +
        '<span class="pallino" style="background:' + esc(c.colore) + '"></span>' +
        '<span>' + esc(c.nome) + '</span>' +
        '<span class="durata">' + fmtDurata(x) + ' di ' + ore + ' ore · mancano ' + fmtDurata(mancano) + '</span>' +
      '</div>';
  });
  const tetto = Number(imp.tettoScivolato) || 0;
  righe +=
    '<div class="tot-riga">' +
      '<span class="pallino" style="background:var(--disp)"></span>' +
      '<span>Dispersione scivolata</span>' +
      '<span class="durata">' + fmtDurata(tot.scivolato) + ' · tetto ' + tetto + ' ore</span>' +
    '</div>';

  el.innerHTML =
    '<div class="scatola">' +
      '<div class="attrito-cat"><span class="pallino" style="background:' + esc(cat.colore) + '"></span><span>' + esc(cat.nome) + '</span></div>' +
      '<div class="micro">Questa settimana</div>' +
      '<div class="pannello">' + righe + '</div>' +
      '<div class="attrito-azioni">' +
        '<button class="btn btn-fantasma" data-a-vai disabled>Vai comunque <span data-conto>(5)</span></button>' +
        '<button class="btn btn-primario" data-a-lascia>Lascia stare</button>' +
      '</div>' +
    '</div>';
  el.hidden = false;

  const btnVai = el.querySelector('[data-a-vai]');
  let resto = 5;
  clearInterval(timerConto);
  timerConto = setInterval(() => {
    resto--;
    const conto = el.querySelector('[data-conto]');
    if (resto <= 0) {
      clearInterval(timerConto);
      if (conto) conto.remove();
      btnVai.disabled = false;
    } else if (conto) {
      conto.textContent = '(' + resto + ')';
    }
  }, 1000);

  btnVai.addEventListener('click', () => {
    if (btnVai.disabled) return;
    clearInterval(timerConto);
    pulisciTrigger();
    avviaSessione(cat.id, null, 'scivolato');
    chiudiApp();
  });
  el.querySelector('[data-a-lascia]').addEventListener('click', () => {
    clearInterval(timerConto);
    pulisciTrigger();
    el.hidden = true;
    el.innerHTML = '';
    vistaCorrente = 'home'; // richiesto esplicitamente: "Lascia stare" porta alla home
    rendi();
    animaIngresso($('#vista-home'));
    controllaTimerVecchio();
  });
}

function chiudiApp() {
  // window.close funziona per le finestre aperte da script e per alcune PWA
  // installate; se il browser lo impedisce resta una schermata minimale.
  try { window.close(); } catch (err) {}
  setTimeout(() => {
    const el = $('#attrito');
    el.innerHTML = '<div class="attrito-chiusa">Timer avviato · puoi chiudere questa scheda</div>';
    el.hidden = false;
  }, 150);
}

/* ================= Eventi globali e avvio ================= */
function attaccaEventi() {
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-avvia],[data-stop],[data-focus-apri],[data-focus-chiudi],[data-modifica],[data-vista],[data-impostazioni],[data-giorno-delta],[data-giorno-oggi],[data-review-scrivi],[data-undo-annulla]');
    if (!b) return;
    if (b.dataset.avvia !== undefined) {
      const parti = b.dataset.avvia.split('|');
      richiediAvvio(parti[0], parti[1] || null);
    } else if (b.dataset.stop !== undefined) {
      fermaSessione();
    } else if (b.dataset.focusApri !== undefined) {
      apriFocus();
    } else if (b.dataset.focusChiudi !== undefined) {
      chiudiFocus();
    } else if (b.dataset.modifica !== undefined) {
      apriModaleModifica(b.dataset.modifica);
    } else if (b.dataset.vista !== undefined) {
      vistaCorrente = b.dataset.vista;
      if (vistaCorrente === 'giorno') giornoVista = new Date();
      rendi();
      animaIngresso($('#vista-' + vistaCorrente));
    } else if (b.dataset.impostazioni !== undefined) {
      apriModaleImpostazioni();
    } else if (b.dataset.giornoDelta !== undefined) {
      const d = parseInt(b.dataset.giornoDelta, 10);
      giornoVista = new Date(giornoVista.getFullYear(), giornoVista.getMonth(), giornoVista.getDate() + d);
      rendiGiorno();
      animaIngresso($('#vista-giorno'));
    } else if (b.dataset.giornoOggi !== undefined) {
      giornoVista = new Date();
      rendiGiorno();
      animaIngresso($('#vista-giorno'));
    } else if (b.dataset.reviewScrivi !== undefined) {
      apriModaleReview();
    } else if (b.dataset.undoAnnulla !== undefined) {
      annullaEliminazione();
    }
  });

  $('#velo').addEventListener('click', (e) => {
    if (e.target.id === 'velo') { chiudiModale(); rendi(); }
  });

  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) $('#focus').hidden = true;
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      controllaTimerVecchio();
      rendi();
    }
  });

  // Un'altra scheda della stessa app ha scritto sui dati: ricarica lo stato.
  window.addEventListener('storage', (e) => {
    if (e.key !== CHIAVE) return;
    try { carica(); } catch (err) {}
    if (!statoCorrotto) rendi();
  });
}

function tick() {
  secondi++;
  const attiva = sessioneAttiva();
  if (!attiva) return;
  const testo = fmtCrono(Date.now() - Date.parse(attiva.inizio));
  document.querySelectorAll('[data-crono]').forEach((el) => { el.textContent = testo; });
  // Aggiorna barra e totali del giorno mentre il timer corre.
  if (secondi % 30 === 0) {
    if (vistaCorrente === 'giorno') rendiGiorno();
    if (vistaCorrente === 'settimana') rendiSettimana();
  }
}

function init() {
  carica();
  if (statoCorrotto) return; // la schermata di recupero è già visibile
  attaccaEventi();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  rendi();
  setInterval(tick, 1000);
  const trigger = leggiTrigger();
  if (trigger) { apriAttrito(trigger); return; }
  pulisciTrigger(); // rimuove un eventuale parametro non valido, senza schermata
  animaIngresso($('#vista-' + vistaCorrente));
  controllaTimerVecchio();
}

init();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
